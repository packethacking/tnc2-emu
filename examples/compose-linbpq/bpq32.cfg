; LinBPQ half of the tnc2-emu example.
SIMPLE=1
NODECALL=G9BPQ
NODEALIAS=BPQNOD
LOCATOR=IO91WL
; Send NODES every 5 minutes, like the TheNet node here.
NODESINTERVAL=5

PORT
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 MAXSESSIONS=10
 ; Example only: change this password before you expose the port. The user's
 ; callsign differs from NODECALL, so that "C 2 !G9TNT-1" makes a level 2
 ; connect of its own rather than clashing with the node link.
 USER=sysop,changeme,G9ABC,,SYSOP
ENDPORT

; The TheNet node's radio port, KISS over TCP. LinBPQ dials the emulator.
PORT
 ID=TheNet TNC2
 TYPE=ASYNC
 PROTOCOL=KISS
 IPADDR=172.29.75.10
 TCPPORT=8001
 QUALITY=192
 MAXFRAME=2
 PACLEN=120
 FRACK=8000
 RESPTIME=1500
 RETRIES=10
ENDPORT

; TheNet is an AX.25 2.0 node and ignores the 2.2 XID frame LinBPQ opens
; node links with, so LinBPQ gives up on it. NOV2.2=1 makes LinBPQ send a
; plain SABM to this neighbour instead.
ROUTES:
CALL=G9TNT-1,PORT=2,QUALITY=192,NOV2.2=1
***
