# XRouter half of the tnc2-emu example. Comment lines must start in column 1.
NODECALL=G9XRT
NODEALIAS=XRNODE
CONSOLECALL=G9XRT
TELNETPORT=23
LOCATOR=IO91WL
IPADDRESS=172.29.74.11
NODESINTERVAL=5

CTEXT
G9XRT XRouter, linked to a TheNet X1J node on port 1.
Type ? for commands, C TNET to reach TheNet.
***

# The TheNet node's radio port, KISS over TCP. XRouter dials the emulator.
INTERFACE=1
    TYPE=TCP
    ID=TheNet TNC2
    PROTOCOL=KISS
    MTU=256
    IOADDR=172.29.74.10
    INTNUM=8001
ENDINTERFACE

PORT=1
    ID=TNC2 radio channel
    INTERFACENUM=1
    CHANNEL=A
    QUALITY=192
    MAXFRAME=2
    PACLEN=120
    FRACK=8000
    RESPTIME=1500
    RETRIES=10
ENDPORT
