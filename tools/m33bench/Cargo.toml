# Counts the Arm instructions tnc2-core runs per Z80 clock on a Cortex-M33,
# under QEMU. Not a workspace member: it has its own toolchain and target,
# like crates/tnc2-pico. README.md says how to run it.

[package]
name = "m33bench"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "m33bench"
test = false
bench = false

[dependencies]
tnc2-core = { path = "../../crates/tnc2-core" }
cortex-m = { version = "=0.7.9", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "=0.7.7"
cortex-m-semihosting = "=0.5.0"
embedded-alloc = { version = "=0.7.0", default-features = false, features = ["llff"] }
panic-semihosting = "=0.6.0"

# The same as the firmware's (crates/tnc2-pico/Cargo.toml).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
