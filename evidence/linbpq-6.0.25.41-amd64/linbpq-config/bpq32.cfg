; LinBPQ side of the TheNet X1J interop run (generated by interop/run_linbpq.py).
SIMPLE=1
NODECALL=G9BPQ
NODEALIAS=BPQNOD
LOCATOR=IO91WL
NODESINTERVAL=1

PORT
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 MAXSESSIONS=10
 USER=sysop,changeme,G9ABC,,SYSOP
ENDPORT

; The TNC-2 emulator's radio port, as KISS over TCP. LinBPQ is the client.
PORT
 ID=TheNet TNC2
 TYPE=ASYNC
 PROTOCOL=KISS
 IPADDR=172.29.76.10
 TCPPORT=8001
 PORTCALL=G9BPQ-2
 QUALITY=192
 MAXFRAME=2
 PACLEN=120
 FRACK=8000
 RESPTIME=1500
 RETRIES=10
ENDPORT

; TheNet ignores XID, so talk AX.25 2.0 (plain SABM) to it.
ROUTES:
CALL=G9TNT-1,PORT=2,QUALITY=192,NOV2.2=1
***
