[workspace]
members = ["crates/tnc2-core", "crates/tnc2-node"]
default-members = [".", "crates/tnc2-core", "crates/tnc2-node"]
# The Pico firmware has its own toolchain, target and lock file, and keeps
# its Embassy dependencies out of host builds (crates/tnc2-pico/Cargo.toml).
exclude = ["crates/tnc2-pico", "tools/m33bench", "tools/qemu-pace"]

[package]
name = "tnc2-emu"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/packethacking/tnc2-emu"

[dependencies]
libc = "0.2.190"
tnc2-core = { path = "crates/tnc2-core" }
